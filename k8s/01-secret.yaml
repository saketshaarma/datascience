# Replace the placeholder values before applying.
# Tip: generate a JWT secret with `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: infraforge-secrets
  namespace: infraforge
type: Opaque
stringData:
  JWT_SECRET: "change-me-to-a-long-random-hex-string"
  ADMIN_EMAIL: "admin@infraforge.io"
  ADMIN_PASSWORD: "ChangeMe@12345"
