# Requires an ingress controller (e.g. ingress-nginx) in the cluster.
# Update `host` to your domain, or remove it to match all hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infraforge
  namespace: infraforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
    - host: infraforge.local
      http:
        paths:
          # API goes straight to the backend service.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: infraforge-backend
                port:
                  number: 8001
          # Everything else served by the frontend (Nginx SPA).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infraforge-frontend
                port:
                  number: 80
