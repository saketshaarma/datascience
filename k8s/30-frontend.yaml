# Build & push the frontend image (with empty backend URL for same-origin /api):
#   docker build --build-arg REACT_APP_BACKEND_URL="" -t <registry>/infraforge-frontend:latest ./frontend
#   docker push <registry>/infraforge-frontend:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraforge-frontend
  namespace: infraforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infraforge-frontend
  template:
    metadata:
      labels:
        app: infraforge-frontend
    spec:
      containers:
        - name: frontend
          image: infraforge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: infraforge-config
                  key: BACKEND_HOST
            - name: NGINX_ENVSUBST_FILTER
              value: "BACKEND_HOST"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: infraforge-frontend
  namespace: infraforge
spec:
  selector:
    app: infraforge-frontend
  ports:
    - port: 80
      targetPort: 80
